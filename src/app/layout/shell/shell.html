<aside class="sidebar">
    <nav>
        @for (item of visibleItems(); track item.path) {
            <a [routerLink]="item.path" routerLinkActive="active"
            [routerLinkActiveOptions]="{  exact: true }">{{ item.label }}</a>
        }
    </nav>
    <button type="button" (click)="auth.logout()">Sign out</button>
</aside>

<main class="content">
    <router-outlet />
</main>
